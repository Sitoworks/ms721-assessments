<style>
:root{--bg:#f3f6fb;--card:#ffffff;--ink:#0b1f3a;--muted:#51627a;--line:#d9e2ef;--blue:#0067b8;--blue2:#005a9e;--navy:#0b2545;--cyan:#007c89;--ok:#0e7a3d;--warn:#9a5200;--bad:#b3283f;--okbg:#e4f4ea;--badbg:#fbe8ec;--warnbg:#fff1df;--soft:#eaf2fb;--shadow:0 1px 2px rgba(11,37,69,.06),0 6px 18px rgba(11,37,69,.07);--bar2:#00a3b4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"] .primary,:root[data-theme="dark"] .tabs button.on{color:#06223f}
:root[data-theme="dark"]{--bg:#09111f;--card:#101b2f;--ink:#e8eef8;--muted:#a3b3c9;--line:#24354f;--blue:#5aaeff;--blue2:#7bbcff;--navy:#0a1a33;--cyan:#45d0dc;--ok:#52c98d;--warn:#ffb454;--bad:#ff8196;--okbg:#10291e;--badbg:#321622;--warnbg:#2e2210;--soft:#14263f;--shadow:0 1px 2px rgba(0,0,0,.4);--bar2:#35c4d3}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100%}

.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}

label.fl{display:block;font-weight:600;margin:10px 0 4px}
.hero{background:linear-gradient(135deg,var(--navy),#0b3d75);color:#fff;border:0}.hero p{opacity:.92}

.tile:focus-within{outline:3px solid var(--cyan)}

.opt:hover{border-color:var(--blue)}.opt.sel{border-color:var(--blue);background:var(--soft)}.opt input{margin-top:4px;width:20px;height:20px;flex:none;accent-color:var(--blue)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.ring{display:block;margin:auto}.ring text{fill:var(--ink)}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.kpi b{display:block;font-size:1.6rem;line-height:1.1}.kpi span{color:var(--muted);font-size:.82rem}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:.9rem;width:100%;text-align:left;border:0;background:transparent;padding:2px 0;min-height:0}
.hb .tr{background:var(--line);border-radius:6px;height:16px;position:relative;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:6px;background:var(--blue)}.hb .tr i.b2{background:var(--bar2);margin-top:0}
.hb.two .tr{height:26px}.hb.two .tr i{height:12px;margin-bottom:2px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.hb:hover .lb{text-decoration:underline}
.vb{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px;border-bottom:1px solid var(--line)}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.vb .c i{display:block;width:100%;max-width:60px;border-radius:6px 6px 0 0;background:var(--blue);min-height:2px}.vb .c i.b2{background:var(--bar2)}
.vb .c small{font-size:.72rem;color:var(--muted)}
.pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.pair i{flex:1;max-width:28px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:4px 0}.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none;background:var(--blue)}.legend s.b2{background:var(--bar2)}.legend s.g3{background:#8a9bb3}
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tbl tr.cl{cursor:pointer}.tbl tr.cl:hover{background:var(--soft)}.scroll{overflow-x:auto;max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{border-radius:999px;min-height:38px;padding:6px 14px}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.alert{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft)}.alert.w{background:var(--warnbg);border-color:var(--warn)}.alert.e{background:var(--badbg);border-color:var(--bad)}.alert.s{background:var(--okbg);border-color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(5,12,25,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
.modal .box{background:var(--card);color:var(--ink);border-radius:14px;max-width:760px;width:100%;padding:18px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}#toast.show{opacity:1}
.rv{border-left:4px solid var(--line);padding:8px 12px;margin:10px 0}.rv.c{border-color:var(--ok)}.rv.w{border-color:var(--bad)}.rv.u{border-color:var(--warn)}
.sq{display:inline-block;width:18px;height:18px;border-radius:4px;margin:1px;background:var(--line)}.sq.c{background:var(--ok)}.sq.w{background:var(--bad)}.sq.u{background:var(--warn)}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85em}
.sr{position:absolute;left:-9999px}
.only-print{display:none}
@media (max-width:560px){.wrap{padding:12px}.card{padding:14px}h1{font-size:1.35rem}.hb{grid-template-columns:90px 1fr 46px}.brand small{display:none}}

@media print{.top,.noprint,#toast,.tabs,button{display:none!important}.only-print{display:block}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.modal{display:none}.wrap{padding:0}:root{--bg:#fff;--card:#fff;--ink:#000;--muted:#333;--line:#bbb;--soft:#f2f2f2}}

<script>
const BANK={"meta": {"title": "MS-721: Plan, Configure and Manage Collaboration Communications Systems with Microsoft Teams", "blurb": "A five-day course for collaboration communications systems engineers: Teams meetings, webinars and town halls, Teams Phone and PSTN connectivity (Calling Plans, Operator Connect, Teams Phone Mobile, Direct Routing), auto attendants and call queues, emergency calling, network readiness and QoS, Teams Rooms, Surface Hub and Teams devices, monitoring and troubleshooting, and BYOD spaces with bookable desks.", "disclaimer": "These assessments are course knowledge checks written for this class. They are not Microsoft certification exams and do not reproduce Microsoft exam content."}, "domains": {"D1": {"name": "Plan and design collaboration systems", "url": "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ms-721"}, "D2": {"name": "Meetings, webinars and town halls", "url": "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ms-721"}, "D3": {"name": "Teams Phone", "url": "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ms-721"}, "D4": {"name": "Teams Rooms and devices", "url": "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ms-721"}}, "pre": [{"id": "P01", "d": "D1", "df": "B", "t": "s", "q": "Which PSTN connectivity option makes Microsoft the carrier, with no SBC or voice trunk for you to configure?", "o": ["Operator Connect", "Direct Routing", "Teams Phone Mobile", "Teams Calling Plans"]}, {"id": "P02", "d": "D1", "df": "B", "t": "s", "q": "An organization wants to keep its existing carrier contracts and connect through a certified Session Border Controller. Which option fits?", "o": ["Direct Routing", "Teams Calling Plans", "Shared Calling", "Audio Conferencing with Communication Credits"]}, {"id": "P03", "d": "D1", "df": "B", "t": "s", "q": "How many Teams Rooms Basic licenses can a tenant use at no cost?", "o": ["Up to 100 rooms per tenant", "Up to 25 rooms per tenant", "There is no limit", "Up to 10 rooms per tenant"]}, {"id": "P04", "d": "D1", "df": "I", "t": "s", "q": "What round-trip time (RTT) target does Microsoft give for Teams media between the client and the Microsoft network edge?", "o": ["Under 150 ms", "Under 300 ms", "Under 100 ms", "Under 60 ms"]}, {"id": "P05", "d": "D1", "df": "I", "t": "m", "q": "Select TWO tools that help you plan or assess network readiness for Teams.", "o": ["Emergency calling policies", "Network Planner in the Teams admin center", "Teams Network Assessment Tool", "Dial plan normalization rules"]}, {"id": "P06", "d": "D1", "df": "A", "t": "s", "q": "Branch users reach Microsoft 365 through a central VPN and data center, and call quality is poor. Which design change helps most?", "o": ["Force Teams media to use TCP instead of UDP so that it passes the VPN concentrator reliably", "Route all Teams traffic through the central proxy so it can be inspected before it leaves the network", "Allow local internet breakout and exclude Teams media from the VPN (split tunneling)", "Raise the Media Bit Rate limit for the whole tenant so that the VPN can carry more traffic"]}, {"id": "P07", "d": "D1", "df": "A", "t": "s", "q": "Which statement about QoS for Teams is correct?", "o": ["DSCP markings are honored by routers across the public internet, so no private network design is needed", "QoS applies to audio only, so video and screen sharing do not need separate port ranges or markings", "DSCP markings help only on networks you control, and only when that network respects them", "Enabling QoS in the Teams admin center is enough, because routers will then apply priority automatically"]}, {"id": "P08", "d": "D2", "df": "B", "t": "s", "q": "A company wants a customer-facing event with a registration page and automated confirmation emails. Which Teams event type fits?", "o": ["Channel meeting", "Teams webinar", "Meet now meeting", "Teams town hall"]}, {"id": "P09", "d": "D2", "df": "B", "t": "s", "q": "Which Teams event type is built for company-wide broadcasts, with a Producer role, custom branding and up to 20,000 attendees?", "o": ["Virtual appointment", "Teams webinar", "Channel meeting", "Teams town hall"]}, {"id": "P10", "d": "D2", "df": "A", "t": "s", "q": "A feature is On in the organizer's meeting policy but Off in a participant's policy. What happens?", "o": ["Neither can use it", "The participant can use it because user policies override organizer policies", "The organizer can use the feature, but that participant cannot", "Both can use it because the organizer's policy wins"]}, {"id": "P11", "d": "D2", "df": "I", "t": "s", "q": "Which statement about dedicated Audio Conferencing numbers is correct?", "o": ["Only shared toll numbers can be assigned to organizers; dedicated numbers are used by the bridge only", "They are assigned directly to each meeting attendee so that anyone can dial in with their own number", "They are assigned to the conference bridge first and then to the people who organize meetings", "They are created automatically each time a meeting is scheduled and released when it ends"]}, {"id": "P12", "d": "D2", "df": "I", "t": "s", "q": "Which meeting artifact mode creates a transcript but no audio or video recording?", "o": ["Record", "Transcribe", "Copilot only during the meeting", "Live captions only"]}, {"id": "P13", "d": "D2", "df": "A", "t": "m", "q": "Select TWO capabilities that require Teams Premium.", "o": ["Standard live captions", "Breakout rooms", "Advanced virtual appointments with SMS notifications", "Intelligent meeting recap"]}, {"id": "P14", "d": "D3", "df": "B", "t": "s", "q": "What do dial plans do in Teams Phone?", "o": ["Assign emergency addresses to network sites so dynamic locations can be detected for callers", "Decide which agents in a call queue receive calls and in which order they ring", "Use normalization (regex) rules to translate dialed numbers into a standard format", "Control which users are allowed to record calls and where the recordings are stored"]}, {"id": "P15", "d": "D3", "df": "I", "t": "s", "q": "Where are Teams Cloud Voicemail messages delivered?", "o": ["To the user's Exchange mailbox", "To a SharePoint document library", "To a third-party email system", "To the user's OneDrive"]}, {"id": "P16", "d": "D3", "df": "B", "t": "s", "q": "Which policy changes or blocks the phone number shown on outbound PSTN calls?", "o": ["Call park policy", "Calling policy", "Voicemail policy", "Caller ID policy"]}, {"id": "P17", "d": "D3", "df": "I", "t": "s", "q": "What must be in place before you acquire phone numbers through a Microsoft Calling Plan?", "o": ["A custom domain for the tenant", "Emergency calling addresses", "A voice routing policy", "A paired SBC"]}, {"id": "P18", "d": "D3", "df": "I", "t": "s", "q": "What is a resource account in the context of auto attendants and call queues?", "o": ["A Microsoft 365 group that stores voicemail and that every agent in the queue belongs to", "A Teams channel that holds the queue agents and lets channel owners manage membership", "A disabled Microsoft Entra ID user object that represents the voice application", "A shared mailbox that agents sign in to so that they can answer calls on behalf of the queue"]}, {"id": "P19", "d": "D3", "df": "I", "t": "s", "q": "Which call queue routing method is the default and rings all agents at the same time?", "o": ["Round robin", "Longest idle", "Serial routing", "Attendant routing"]}, {"id": "P20", "d": "D3", "df": "A", "t": "s", "q": "A call queue must behave differently outside business hours. What is the recommended approach?", "o": ["Enable conference mode on the queue so that callers are connected to agents more quickly", "Assign the number to an auto attendant that sends callers to the queue during business hours", "Create a second resource account for the queue and assign it a separate after-hours number", "Add a holiday set directly to the call queue so it can play a different greeting after hours"]}, {"id": "P21", "d": "D3", "df": "A", "t": "s", "q": "Which sequence correctly links a user's authorization to an SBC in Direct Routing?", "o": ["PSTN usage, then voice routing policy, then SBC gateway, then voice route", "SBC gateway, then PSTN usage, then dial plan, then voice route", "Voice route, then voice routing policy, then SBC gateway, then PSTN usage", "Voice routing policy, then PSTN usage, then voice route, then SBC gateway"]}, {"id": "P22", "d": "D3", "df": "A", "t": "m", "q": "Select TWO things to check when an SBC shows as offline in Teams.", "o": ["The call park policy assigned to users", "A valid TLS certificate with a trusted root", "The default Audio Conferencing bridge number", "NTP and DNS configuration on the SBC"]}, {"id": "P23", "d": "D3", "df": "I", "t": "s", "q": "What does a Survivable Branch Appliance (SBA) provide?", "o": ["Translation of numbers between the SBC and the PSTN carrier", "Encryption of voicemail messages stored in the user's Exchange mailbox", "Recording of calls and meetings for regulated compliance purposes", "Continued calling for branch users during an internet outage"]}, {"id": "P24", "d": "D4", "df": "B", "t": "s", "q": "Which operating system do Teams phones run?", "o": ["Ubuntu Linux", "iOS", "Android", "Windows 10 IoT"]}, {"id": "P25", "d": "D4", "df": "B", "t": "s", "q": "Which license is intended for common area phones and bookable desks?", "o": ["Teams Premium", "Audio Conferencing", "Teams Shared Devices", "Teams Rooms Pro"]}, {"id": "P26", "d": "D4", "df": "I", "t": "s", "q": "Which capability requires Teams Rooms Pro rather than Teams Rooms Basic?", "o": ["Wireless content sharing", "One-touch join to scheduled meetings", "Management through the Teams Rooms Pro Management portal", "Viewing basic device information in the Teams admin center"]}, {"id": "P27", "d": "D4", "df": "I", "t": "s", "q": "What does a Teams Rooms device typically sign in with?", "o": ["A resource account licensed for call queues and auto attendants", "A guest account created in the tenant for each room and licensed for Teams Phone", "The personal account of the room's owner, which must remain signed in on the device", "A room resource account, usually a room mailbox, licensed for Teams Rooms Basic or Pro"]}, {"id": "P28", "d": "D4", "df": "I", "t": "s", "q": "Which feature lets a Teams Rooms device join Cisco Webex and Zoom meetings?", "o": ["Direct Guest Join", "Proximity join", "Cloud Video Interop", "SIP Gateway"]}, {"id": "P29", "d": "D4", "df": "I", "t": "s", "q": "Which steps remotely provision a Teams Android phone?", "o": ["Upload the device MAC address in the Teams admin center, then sign in with the verification code", "Join the phone to an on-premises Active Directory domain and apply the Teams device settings", "Apply a Group Policy object that provisions the phone and signs in the Teams client", "Install the Teams Rooms app on the phone from a USB drive supplied by the manufacturer"]}, {"id": "P30", "d": "D4", "df": "A", "t": "s", "q": "In BYOD spaces, when does a discovered peripheral appear in the Teams Rooms Pro Management portal?", "o": ["As soon as any single user connects it to a PC running the Teams client", "When it has been used by at least five unique internal users", "Only after an administrator registers its serial number in the portal", "After it has been connected continuously for twenty-four hours"]}], "post": [{"id": "Q01", "d": "D1", "df": "B", "t": "s", "q": "How are Operator Connect phone numbers managed?", "o": ["In the Teams admin center, in the same way as Calling Plan numbers", "Only on the SBC that the operator manages for the tenant", "Only in the operator's own portal, not in any Microsoft admin center", "In the Exchange admin center together with the user's mailbox settings"]}, {"id": "Q02", "d": "D1", "df": "B", "t": "s", "q": "Which solution lets a user's single business- etting", "The most restrictive setting"]}, {"id": "Q15", "d": "D2", "df": "I", "t": "s", "q": "How can PSTN dial-in for Teams meetings be paid for?", "o": ["Only with a Teams Calling Plan assigned to every person who organizes meetings", "With per-user Audio Conferencing licenses or with Communication Credits", "Only with Teams Premium, which includes dial-in numbers for all meetings", "It is free with every Teams license, with numbers shared across the tenant"]}, {"id": "Q16", "d": "D2", "df": "A", "t": "s", "q": "What does the Copilot setting 'On only with retained transcript' do?", "o": ["Copilot is disabled for the whole tenant until a transcript policy is assigned", "Copilot is available during and after the meeting, and organizers cannot change it", "Copilot works only during the meeting and no transcript is retained afterward", "Organizers can switch Copilot to 'only during the meeting' when they schedule"]}, {"id": "Q17", "d": "D2", "df": "A", "t": "s", "q": "Which solution can block the download of meeting recordings and transcripts?", "o": ["Teams meeting customization policies", "Microsoft Purview sensitivity labels", "Exchange mail flow rules", "SharePoint Advanced Management"]}, {"id": "Q18", "d": "D2", "df": "A", "t": "s", "q": "In a meeting customization policy, which meeting areas can show a custom logo?", "o": ["Join launcher and meeting stage", "All four areas", "Meeting stage and lobby", "Pre-join and lobby"]}, {"id": "Q19", "d": "D2", "df": "B", "t": "s", "q": "Which statement about Teams meeting attendee limits is correct?", "o": ["Every meeting becomes view-only for attendees once it exceeds 100 participants", "Town halls are limited to 1,000 attendees, even with Teams Premium licenses", "Up to 1,000 participants are interactive; beyond that, up to 20,000 can attend view-only", "Webinars have no attendee limit as long as everyone registers beforehand"]}, {"id": "Q20", "d": "D2", "df": "I", "t": "m", "q": "Select TWO ways to control access to im function sha256(str){const msg=unescape(encodeURIComponent(str)),len=msg.length,nW=(((len+8)>>6)+1)*16,w=new Array(nW).fill(0);

H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}

const apiOk=()=>/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.sheetUrl);
async function api(payload,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||25000);

if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}

try{const r=await fetch(CONFIG.sheetUrl+"?action=config",{signal:ctl.signal,redirect:"follow"}),j=await r.json();
if(j&&j.ok&&j.config){const c=j.config;["preOpen","postOpen","showExplanations","allowRetake"].forEach(k=>{if(typeof c[k]==="boolean")CONFIG[k]=c[k]});

const skey=()=>{try{return sessionStorage.getItem("ms721.tk")||""}catch(e){return""}};

if(!apiOk()){S.loginErr="This page is not connected to a Google Apps Script yet. Check config.js (see the README).";S.ownerKnown=true;return render(true)}
S.loggingIn=true;S.loginErr="";if(!silent)render(true);
try{const r=await api({action:"results",key:pw});
if(r&&r.ok){S.key=pw;setkey(pw);S.isOwner=true;S.ownerKnown=true;S.loggingIn=false;applyResults(r);render();return}

function doLogout(){S.isOwner=false;S.key="";setkey("");const all=ls.get(REC,[]).filter(x=>x.src!=="sheet");ls.set(REC,all);S.sync={ok:null,msg:"",at:0,added:0,total:0};S.loginErr="";S.modal=null;render()}
let syncing=false;
function applyResults(r){const toks=[...new Set((r.codes||[]).filter(c=>typeof c==="string"))];let all=ls.get(REC,[]),add=0,bad=0,gone=0;
const before=all.length;all=all.filter(x=>x.src!=="sheet"||toks.includes(x.code));gone=before-all.length;

function metrics(V){const L=V.L,B=bench(),pre=L.filter(x=>x.pre),post=L.filter(x=>x.post),both=L.filter(x=>x.pre&&x.post),ap=mean(pre.map(x=>pct(x.pre))),aq=mean(post.map(x=>pct(x.post))),ch=mean(both.map(x=>pct(x.post)-pct(x.pre)));
const sorted=V.recs.slice().sort((a,b)=>pct(b)-pct(a));const latest=x=>x.post||x.pre;
return{n:L.length,pre,post,both,ap,aq,ch,hi:sorted[0],lo:sorted[sorted.length-1],below:L.filter(x=>pct(latest(x))<B).length,B}}

const nBoth=m.both.length,nPre=V.L.filter(x=>x.full.pre&&!x.full.post).length,nPost=V.L.filter(x=>x.full.post&&!x.full.pre).length,tot=V.L.length||1;

return filters()+`<section class="grid g4">${[["Learners",m.n],["Pre completed",m.pre.length],["Post completed",m.post.length],["Pre completion",m.n?f1(m.pre.length/m.n*100)+"%":"-"],["Post completion",m.n?f1(m.post.length/m.n*100)+"%":"-"],["Average pre",m.ap==null?"-":f1(m.ap)+"%"],["Average post",m.aq==null?"-":f1(m.aq)+"%"],["Average change (matched)",m.ch==null?"-":sgn(m.ch)+" pp"],["Highest score",m.hi?f1(pct(m.hi))+"%":"-"],["Lowest score",m.lo?f1(pct(m.lo))+"%":"-"],["Below "+m.B+"% benchmark",m.below]].map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</section>

${g.pre&&g.post?`<p><b>Change: ${sgn(pct(g.post)-pct(g.pre))} percentage points</b></p>`:""}<h3 style="margin-top:12px">Topic scores</h3>${legend2("Pre","Post")}${DOM.map(d=>hb2(dname(d),g.pre?g.pre.tp[d][0]/g.pre.tp[d][1]*100:null,g.post?g.post.tp[d][0]/g.post.tp[d][1]*100:null)).join("")}
<h3>Question results</h3><p class="small muted">Green correct, red incorrect, orange unanswered. Order follows the question bank.</p>${g.pre?"<div class='small'>Pre</div>"+sq(g.pre):""}${g.post?"<div class='small'>Post</div>"+sq(g.post):""}`};render(true)}
function questionModal(id){const q=QMAP[id],type=BANK.pre.includes(q)?"pre":"post",st=qStats(type,view().recs).find(x=>x.q.id===id);
S.modal={title:q.id+" ("+tName(type)+")",html:`<div class="grid g3"><div class="kpi"><b>${st&&st.p!=null?f1(st.p)+"%":"-"}</b><span>Answered correctly</span></div><div class="kpi"><b>${st?st.n:0}</b><span>Submissions</span></div><div class="kpi"><b>${st?st.u:0}</b><span>Left unanswered</span></div></div>${qDetail(q,false)}`};render(true)}


function syncLine(){const y=S.sync;if(y.ok===null&&!y.msg)return"Waiting to sync...";if(y.ok===false)return y.msg;if(y.msg)return y.msg;return"Synced "+new Date(y.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})+": "+y.total+" result code"+(y.total===1?"":"s")+" in the sheet, "+y.added+" new"+(y.bad?", "+y.bad+" rejected":"")}
function paintSync(){const e=document.querySelector("#syncstat");if(e){e.textContent=syncLine();e.className="small "+(S.sync.ok===false?"bad":"muted")}}

// ===== CSV =====
const csvc=v=>{let s=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csv=rows=>rows.map(r=>r.map(csvc).join(",")).join("\r\n");
async function saveFile(name,text){try{const b=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Saved "+name);return}catch(e){}
S.modal={title:name,html:`<p class="small">Direct download did not work in this browser. Copy the text below into a file named <b>${esc(name)}</b>.</p><textarea style="min-height:260px">${esc(text)}</textarea>`};render(true)}
const csvLearners=()=>{const V=view();return csv([["Name","Learner ID","Status","Pre %","Pre points","Pre submitted","Post %","Post points","Post submitted","Change (percentage points)","Matched by"]].concat(V.L.map(x=>[x.n,x.i,statusOf(x.full),x.pre?pct(x.pre):"",x.pre?x.pre.p+"/"+x.pre.m:"",x.pre?x.pre.s:"",x.post?pct(x.post):"",x.post?x.post.p+"/"+x.post.m:"",x.post?x.post.s:"",x.pre&&x.post?Math.round((pct(x.post)-pct(x.pre))*10)/10:"",x.pre&&x.post?(x.full.weak?"name":"id/name"):""])))};
const csvRecords=()=>csv([["Name","Learner ID","Assessment","Submitted","Points","Max","Percent","Correct","Incorrect","Unanswered","Seconds"].concat(DOM.map(d=>dname(d)+" %")).concat(["Question string (c/w/u in bank order)"])].concat(records().map(r=>[r.n,r.i,r.type,r.s,r.p,r.m,pct(r),r.c,r.w,r.u,r.d].concat(DOM.map(d=>r.tp[d][1]?Math.round(r.tp[d][0]/r.tp[d][1]*1000)/10:"")).concat([r.qs]))));
const csvBank=()=>csv([["Assessment","ID","Objective","Difficulty","Type","Question","Options","Correct answer","Explanation","Source"]].concat(["pre","post"].flatMap(t=>BANK[t].map(q=>[t,q.id,dname(q.d),q.df,q.t==="m"?"multiple":"single",q.q,q.o.join(" | "),correctTexts(q).join(" | "),expl(q.id),BANK.domains[q.d].url]))));

// ===== Demo data =====
function makeDemo(){const r=rng(20261012),names=["Adaeze N.","Bola A.","Chinedu E.","Dami O.","Efe I.","Funmi K.","Gbenga L.","Halima S.","Ify U.","Jide M.","Kemi B.","Lanre T.","Musa Y.","Ngozi C.","Obinna D.","Peace A.","Qudus R.","Rita F.","Sade W."],out=[],base=Date.now()-6*3600e3;
const gen=(type,ab)=>BANK[type].map(q=>{const p=Math.max(.05,Math.min(.97,ab/100+({B:.18,I:0,A:-.16}[q.df])+(r()-.5)*.3));return r()<p?"c":(r()<.06?"u":"w")}).join("");
names.forEach((n,k)=>{const L={name:"Demo "+n,lid:"DEMO-"+String(k+1).padStart(3,"0")},ab=38+r()*25,hasPre=k!==17,hasPost=k!==16&&k!==18||k===16;
if(hasPre){const t1=base+k*60e3;out.push(Object.assign(buildRecord("pre",L,gen("pre",ab),t1-1500e3,t1),{src:"demo"}))}
if(k!==16){const t1=base+3*3600e3+k*70e3;out.push(Object.assign(buildRecord("post",L,gen("post",ab+22+r()*12),t1-2400e3,t1),{src:"demo"}))}});
out.forEach((x,k)=>x.rid="demo"+k);return out}

// ===== Events =====
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;if(el.classList.contains("modal")&&ev.target.closest("[data-stop]"))return;const act=el.dataset.act,id=el.dataset.id;
const A={theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark"},
home(){S.screen="welcome";S.modal=null;render()},finish(){S.screen="welcome";S.attempt=null;S.result=null;S.name="";S.lid="";S.err="";render()},
trainer(){S.screen="trainer";S.tab="overview";render();syncSheet()},start,login(){doLogin()},logout(){doLogout()},saveconfig(){saveConfig()},retrysend(){S.result&&sendResult(S.result)},
"resume-yes"(){begin(S.resumeDraft)},"resume-no"(){ls.del(draftKey(S.resumeDraft));begin(newAttempt(S.type,{name:S.name.trim(),lid:normId(S.lid)}))},
prev(){S.attempt.idx=Math.max(0,S.attempt.idx-1);saveDraft();render()},next(){const a=S.attempt;a.idx=Math.min(a.order.length-1,a.idx+1);saveDraft();render()},
goto(){S.attempt.idx=+id;S.screen="assess";saveDraft();render()},
flag(){const a=S.attempt,q=curQ().id;a.flags=a.flags.includes(q)?a.flags.filter(x=>x!==q):[...a.flags,q];saveDraft();render(true)},
toreview(){S.confirm=false;S.screen="review";render()},backassess(){S.screen="assess";render()},confirmsubmit(){S.confirm=true;render(true)},cancelsubmit(){S.confirm=false;render(true)},submit,
exit(){saveDraft();S.attempt=null;S.screen="welcome";toast("Progress saved on this device");render()},
copycode(){const t=$("#codebox");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast("Code copied"),()=>toast(ok?"Code copied":"Select the code and copy it"));else toast(ok?"Code copied":"Select the code and copy it")},
print(){try{window.print()}catch(e){toast("Printing is blocked in this view. Open the page in a full browser tab to print.")}},
tab(){S.tab=id;render()},resetf(){S.f={type:"all",q:"",status:"all",min:0,max:100,topic:"all"};render(true)},
syncnow(){syncSheet()},learner(){learnerModal(id)},question(){questionModal(id)},mclose(){S.modal=null;render(true)},
csvlearners(){saveFile("ms721-learners.csv",csvLearners())},csvrecords(){saveFile("ms721-submissions.csv",csvRecords())},csvbank(){saveFile("ms721-question-bank.csv",csvBank())},
import(){const toks=($("#imp").value.match(/MS721\.[A-Za-z0-9_\-]+\.[a-f0-9]+/g)||[]);let add=0,dup=0,bad=[];const all=ls.get(REC,[]);toks.forEach(t=>{const d=decodeCode(t);if(!d.ok){bad.push(d.err);return}if(all.some(r=>r.rid===d.rec.rid)){dup++;return}d.rec.code=t;all.push(d.rec);add++});ls.set(REC,all);
$("#impres").textContent=`Added ${add}, duplicates ignored ${dup}, invalid ${bad.length}${bad.length?" ("+[...new Set(bad)].join("; ")+")":""}`;if(!toks.length)$("#impres").textContent="No result codes found in the text.";if(add)toast(add+" result"+(add>1?"s":"")+" imported")},
savebench(){const v=Number($("#benchin").value);if(!(v>=0&&v<=100))return toast("Enter a value from 0 to 100");const s=ls.get(SET,{});s.benchmark=v;ls.set(SET,s);toast("Benchmark saved");render(true)},
loaddemo(){ls.set(DEMO,makeDemo());S.src="demo";toast("Demo data loaded");render(true)},
resetdemo(){ls.del(DEMO);toast("Demo data reset");render(true)},
clearreal(){if(confirm("Clear results cached on this browser? They will re-sync from the Google Sheet.")){ls.set(REC,[]);toast("Cache cleared");render(true);syncSheet()}}};
if(A[act]){ev.preventDefault();A[act]()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="pw"){ev.preventDefault();doLogin()}if(ev.key==="Escape"&&S.modal){S.modal=null;render(true)}if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("tr.cl")){ev.preventDefault();ev.target.click()}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.name==="atype"){S.type=t.value;render(true)}else if(t.name==="ans"){pick(+t.dataset.k,t.checked)}
else if(t.id==="srcsel"){S.src=t.value;render(true)}else if(t.id==="qtsel"){S.qtype=t.value;render(true)}else if(t.id==="bts"){S.bankType=t.value;render(true)}else if(t.id==="btp"){S.bankTopic=t.value;render(true)}
else if(t.dataset&&t.dataset.f){const k=t.dataset.f;S.f[k]=(k==="min"||k==="max")?Math.max(0,Math.min(100,Number(t.value)||(k==="max"?100:0))):t.value;render(true)}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.id==="fname")S.name=t.value;else if(t.id==="flid")S.lid=t.value;else if(t.dataset&&t.dataset.f==="q"){S.f.q=t.value;clearTimeout(input.h);input.h=setTimeout(()=>{render(true);const e=$("#fq");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},350)}});
function input(){}
window.addEventListener("beforeunload",e=>{const a=S.attempt;if(S.screen==="assess"&&a&&a.status==="in_progress"&&answered(a)<a.order.length){e.preventDefault();e.returnValue=""}});
setInterval(()=>{const e=$("#elapsed");if(e)e.textContent=fmtT((Date.now()-S.t0)/1000)},1000);
(async()=>{loadRemoteConfig();if(skey()){S.loggingIn=true;doLogin(true)}else{S.ownerKnown=true;render(true)}})();
setInterval(()=>{if(S.screen==="trainer"&&S.isOwner)syncSheet()},30000);
render();
</script>
